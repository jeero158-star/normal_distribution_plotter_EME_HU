<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Normal Distribution Plotter</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --bg2: #f7f7f5;
    --bg3: #f0eeea;
    --text: #1a1a18;
    --text2: #6b6b66;
    --text3: #9b9b96;
    --border: rgba(0,0,0,0.12);
    --border2: rgba(0,0,0,0.22);
    --accent: #378ADD;
    --accent-dark: #185FA5;
    --danger-bg: #FCEBEB;
    --danger: #A32D2D;
    --radius: 8px;
    --radius-lg: 12px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a;
      --bg2: #252523;
      --bg3: #2e2e2b;
      --text: #f0eeea;
      --text2: #a0a09a;
      --text3: #6b6b66;
      --border: rgba(255,255,255,0.12);
      --border2: rgba(255,255,255,0.22);
      --danger-bg: #3a1a1a;
      --danger: #f09595;
    }
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg3);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem 1rem;
  }

  .container {
    max-width: 860px;
    margin: 0 auto;
  }

  h1 {
    font-size: 22px;
    font-weight: 500;
    margin-bottom: 0.25rem;
  }

  .subtitle {
    font-size: 14px;
    color: var(--text2);
    margin-bottom: 1.75rem;
  }

  .datasets {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 1rem;
  }

  .ds-row {
    background: var(--bg);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 12px 14px;
    transition: box-shadow 0.15s;
  }

  .ds-header {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .ds-header input[type=checkbox] {
    width: 16px;
    height: 16px;
    cursor: pointer;
    accent-color: var(--accent);
    flex-shrink: 0;
  }

  .ds-name-input {
    border: none;
    background: transparent;
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    flex: 1;
    outline: none;
    padding: 3px 6px;
    border-radius: 4px;
    min-width: 0;
  }
  .ds-name-input:focus {
    background: var(--bg2);
  }

  .color-wrap {
    position: relative;
    width: 24px;
    height: 24px;
    flex-shrink: 0;
  }
  .color-swatch {
    width: 24px;
    height: 24px;
    border-radius: 4px;
    border: 0.5px solid var(--border2);
    cursor: pointer;
    display: block;
  }
  .color-wrap input[type=color] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }

  .expand-btn {
    background: none;
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    color: var(--text2);
    font-size: 12px;
    padding: 4px 10px;
    white-space: nowrap;
  }
  .expand-btn:hover { background: var(--bg2); }

  .del-btn {
    background: none;
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    color: var(--text2);
    font-size: 12px;
    padding: 4px 10px;
    display: flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }
  .del-btn:hover { background: var(--danger-bg); color: var(--danger); border-color: var(--danger); }

  .reorder-btns {
    display: flex;
    flex-direction: column;
    gap: 1px;
    flex-shrink: 0;
  }
  .reorder-btn {
    background: none;
    border: 0.5px solid var(--border);
    border-radius: 4px;
    cursor: pointer;
    color: var(--text3);
    font-size: 10px;
    padding: 1px 5px;
    line-height: 1.4;
  }
  .reorder-btn:hover { background: var(--bg2); color: var(--text); }
  .reorder-btn:disabled { opacity: 0.25; cursor: default; }

  .undo-redo-bar {
    display: flex;
    gap: 4px;
    align-items: center;
  }
  .ur-btn {
    background: none;
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    color: var(--text2);
    font-size: 12px;
    padding: 5px 10px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .ur-btn:hover { background: var(--bg2); }
  .ur-btn:disabled { opacity: 0.3; cursor: default; }

  .sub-datasets {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 0.5px solid var(--border);
    display: none;
    flex-direction: column;
    gap: 8px;
  }
  .sub-datasets.open { display: flex; }

  .sub-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 10px;
    background: var(--bg2);
    border-radius: var(--radius);
    border: 0.5px solid var(--border);
  }

  .sub-check {
    margin-top: 2px;
    width: 15px;
    height: 15px;
    accent-color: var(--accent);
    flex-shrink: 0;
    cursor: pointer;
  }

  .sub-info { flex: 1; min-width: 0; }

  .sub-label {
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 3px;
  }

  .sub-label-input {
    border: none;
    background: transparent;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    outline: none;
    padding: 2px 5px;
    border-radius: 4px;
    margin-bottom: 3px;
    display: block;
    width: 100%;
  }
  .sub-label-input:hover { background: var(--bg3); }
  .sub-label-input:focus { background: var(--bg); border: 0.5px solid var(--border2); }

  .sub-preview {
    font-size: 11px;
    color: var(--text3);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 5px;
  }

  .sub-textarea {
    width: 100%;
    font-size: 11px;
    font-family: 'SF Mono', 'Fira Code', monospace;
    padding: 6px 8px;
    border-radius: 6px;
    border: 0.5px solid var(--border2);
    background: var(--bg);
    color: var(--text);
    resize: vertical;
    min-height: 54px;
    line-height: 1.5;
  }
  .sub-textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .sub-del-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text3);
    font-size: 16px;
    padding: 2px;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .sub-del-btn:hover { color: var(--danger); }

  .add-sub-btn {
    font-size: 12px;
    padding: 6px 12px;
    border-radius: var(--radius);
    border: 0.5px dashed var(--border2);
    background: none;
    color: var(--text2);
    cursor: pointer;
    align-self: flex-start;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .add-sub-btn:hover { background: var(--bg3); }

  .actions {
    display: flex;
    gap: 8px;
    margin-bottom: 1.75rem;
    align-items: center;
    flex-wrap: wrap;
  }

  .add-btn {
    padding: 8px 18px;
    border-radius: var(--radius);
    border: 0.5px solid var(--border2);
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .add-btn:hover { background: var(--bg2); }

  .run-btn {
    margin-left: auto;
    padding: 10px 32px;
    border-radius: var(--radius);
    background: var(--accent);
    border: none;
    color: #fff;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .run-btn:hover { background: var(--accent-dark); }
  .run-btn:active { transform: scale(0.98); }

  .chart-card {
    background: var(--bg);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1.25rem;
    margin-top: 0.5rem;
  }

  .chart-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1rem;
  }

  .chart-card-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--text2);
  }

  .export-img-btn {
    padding: 6px 14px;
    border-radius: var(--radius);
    border: 0.5px solid var(--border2);
    background: var(--bg2);
    color: var(--text);
    cursor: pointer;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .export-img-btn:hover { background: var(--bg3); }

  .stats-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin-top: 1rem;
  }
  .stats-table th {
    text-align: left;
    padding: 7px 10px;
    background: var(--bg2);
    color: var(--text2);
    font-weight: 500;
    border-bottom: 0.5px solid var(--border);
  }
  .stats-table td {
    padding: 7px 10px;
    border-bottom: 0.5px solid var(--border);
    color: var(--text);
  }
  .stats-table tr:last-child td { border-bottom: none; }
  .stats-table .color-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 6px;
    vertical-align: middle;
  }

  #chartWrap {
    position: relative;
    width: 100%;
    height: 360px;
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 1rem;
    padding-top: 1rem;
    border-top: 0.5px solid var(--border);
  }

  .leg-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text2);
  }

  .leg-swatch {
    width: 22px;
    height: 3px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  .msg-card {
    background: var(--bg);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 2.5rem;
    text-align: center;
    color: var(--text2);
    font-size: 14px;
  }

  .save-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 1.25rem;
    font-size: 12px;
    color: var(--text3);
  }
  .save-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #1D9E75;
    flex-shrink: 0;
  }
  .reset-link {
    font-size: 12px;
    color: var(--text3);
    cursor: pointer;
    background: none;
    border: none;
    text-decoration: underline;
    padding: 0;
  }
  .reset-link:hover { color: var(--danger); }

  .io-btn {
    padding: 5px 12px;
    border-radius: var(--radius);
    border: 0.5px solid var(--border);
    background: var(--bg);
    color: var(--text2);
    cursor: pointer;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .io-btn:hover { background: var(--bg2); color: var(--text); }

  .axis-controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 1rem;
    padding: 12px 14px;
    background: var(--bg);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    align-items: center;
  }
  .axis-controls label {
    font-size: 12px;
    color: var(--text2);
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .axis-controls input[type=number] {
    width: 72px;
    padding: 4px 7px;
    border-radius: var(--radius);
    border: 0.5px solid var(--border2);
    background: var(--bg2);
    color: var(--text);
    font-size: 12px;
  }
  .axis-controls input[type=number]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .axis-divider { color: var(--border2); font-size: 13px; }
  .axis-section-label {
    font-size: 12px;
    font-weight: 500;
    color: var(--text2);
    margin-right: 4px;
    white-space: nowrap;
  }
  .axis-auto-btn {
    padding: 4px 10px;
    border-radius: var(--radius);
    border: 0.5px solid var(--border);
    background: none;
    color: var(--text2);
    font-size: 11px;
    cursor: pointer;
  }
  .axis-auto-btn:hover { background: var(--bg2); }

  /* Editable title / subtitle */
  .title-input, .subtitle-input {
    display: block;
    width: 100%;
    border: 0.5px solid transparent;
    background: transparent;
    color: var(--text);
    font-family: inherit;
    outline: none;
    border-radius: 6px;
    padding: 2px 6px;
    margin-left: -6px;
  }
  .title-input { font-size: 22px; font-weight: 500; margin-bottom: 0.25rem; }
  .subtitle-input { font-size: 14px; color: var(--text2); margin-bottom: 1.25rem; }
  .title-input:hover, .subtitle-input:hover { background: var(--bg2); }
  .title-input:focus, .subtitle-input:focus { background: var(--bg); border-color: var(--border2); }
  .edit-hint { font-size: 11px; color: var(--text3); margin: -0.9rem 0 1.25rem; }

  /* Notes / reminders */
  .notes-card {
    background: var(--bg);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 12px 14px;
    margin-bottom: 1rem;
  }
  .notes-head {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
  }
  .notes-head-title { font-size: 14px; font-weight: 500; flex: 1; }
  .notes-count { font-size: 12px; color: var(--text3); }
  .notes-body { display: none; flex-direction: column; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 0.5px solid var(--border); }
  .notes-body.open { display: flex; }
  .note-item {
    background: var(--bg2);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 10px;
  }
  .note-top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .note-topic {
    flex: 1;
    min-width: 0;
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 13px;
    font-weight: 500;
    outline: none;
    padding: 2px 5px;
    border-radius: 4px;
  }
  .note-topic:hover { background: var(--bg3); }
  .note-topic:focus { background: var(--bg); }
  .note-date { font-size: 11px; color: var(--text3); white-space: nowrap; }
  .note-text {
    width: 100%;
    font-size: 13px;
    font-family: inherit;
    padding: 6px 8px;
    border-radius: 6px;
    border: 0.5px solid var(--border2);
    background: var(--bg);
    color: var(--text);
    resize: vertical;
    min-height: 54px;
    line-height: 1.5;
  }
  .note-text:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .notes-tab-name { color: var(--accent); }

  /* Chrome-like tabs */
  .tab-strip {
    display: flex;
    align-items: flex-end;
    gap: 4px;
    border-bottom: 1px solid var(--border2);
    margin-bottom: 1rem;
  }
  .tab-list {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    overflow-x: auto;
    min-width: 0;
    margin-bottom: -1px;
    scrollbar-width: thin;
  }
  .tab {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 6px 8px 12px;
    min-width: 96px;
    max-width: 210px;
    flex-shrink: 0;
    border: 1px solid transparent;
    border-bottom: none;
    border-radius: 10px 10px 0 0;
    color: var(--text2);
    font-size: 13px;
    cursor: pointer;
    user-select: none;
  }
  .tab:hover { background: var(--bg2); }
  .tab.active {
    background: var(--bg);
    color: var(--text);
    font-weight: 500;
    border-color: var(--border2);
    border-bottom: 1px solid var(--bg);
  }
  .tab.dragging { opacity: 0.4; }
  .tab.drag-over { box-shadow: inset 2px 0 0 var(--accent); }
  .tab-icon { font-size: 14px; color: var(--text3); flex-shrink: 0; }
  .tab.active .tab-icon { color: var(--accent); }
  .tab-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tab-close {
    width: 20px; height: 20px;
    border: none; border-radius: 50%;
    background: none;
    color: var(--text3);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
    line-height: 1;
    padding: 0;
    flex-shrink: 0;
  }
  .tab-close:hover { background: var(--bg3); color: var(--text); }
  .tab-rename {
    font: inherit;
    flex: 1;
    min-width: 0;
    width: 100%;
    border: 1px solid var(--accent);
    border-radius: 4px;
    padding: 1px 4px;
    background: var(--bg);
    color: var(--text);
    outline: none;
  }
  .new-tab-wrap { position: relative; padding-bottom: 5px; flex-shrink: 0; }
  .new-tab-btn {
    width: 30px; height: 30px;
    border: none; border-radius: 50%;
    background: none;
    color: var(--text2);
    cursor: pointer;
    font-size: 20px;
    line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .new-tab-btn:hover { background: var(--bg); color: var(--text); }
  .tab-menu {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    z-index: 20;
    width: 290px;
    max-width: calc(100vw - 32px);
    background: var(--bg);
    border: 0.5px solid var(--border2);
    border-radius: var(--radius);
    box-shadow: 0 8px 24px rgba(0,0,0,0.14);
    padding: 4px;
  }
  .tab-menu.open { display: block; }
  .tab-menu button {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    width: 100%;
    text-align: left;
    padding: 8px 10px;
    border: none;
    border-radius: 6px;
    background: none;
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
  }
  .tab-menu button:hover { background: var(--bg2); }
  .tab-menu button i { font-size: 16px; color: var(--text2); margin-top: 1px; }
  .tab-menu small { display: block; font-size: 11px; color: var(--text3); margin-top: 2px; }
</style>
</head>
<body>
<div class="container">
  <input class="title-input" id="titleInput" value="Normal distribution plotter"
         placeholder="Topic of this work…" onchange="setMeta('title', this.value)" title="Click to edit the topic">
  <input class="subtitle-input" id="subtitleInput" value="Add datasets, select sub-datasets, then press RUN to plot."
         placeholder="Short description…" onchange="setMeta('subtitle', this.value)" title="Click to edit the description">
  <p class="edit-hint"><i class="ti ti-pencil"></i> Click the title or description to edit</p>

  <div class="tab-strip">
    <div class="tab-list" id="tabList"></div>
    <div class="new-tab-wrap">
      <button class="new-tab-btn" onclick="toggleTabMenu(event)" title="New tab">+</button>
      <div class="tab-menu" id="tabMenu">
        <button onclick="addTab('copy')">
          <i class="ti ti-copy"></i>
          <span>Same layout as current tab<small>Same dataset names, colours and BXL/BL/BM/BS — data left empty</small></span>
        </button>
        <button onclick="addTab('blank')">
          <i class="ti ti-file-plus"></i>
          <span>Blank tab<small>Starts with one empty dataset</small></span>
        </button>
      </div>
    </div>
  </div>

  <div class="notes-card">
    <div class="notes-head" onclick="toggleNotes()">
      <i class="ti ti-notes"></i>
      <span class="notes-head-title">Notes &amp; reminders · <span id="notesTabName" class="notes-tab-name"></span></span>
      <span class="notes-count" id="notesCount"></span>
      <i class="ti ti-chevron-down" id="notesChevron"></i>
    </div>
    <div class="notes-body" id="notesBody">
      <div id="notesList" style="display:flex;flex-direction:column;gap:8px"></div>
      <button class="add-sub-btn" onclick="addNote()">
        <i class="ti ti-plus"></i> Add topic / note
      </button>
    </div>
  </div>

  <div class="save-bar">
    <div class="save-dot" id="saveDot"></div>
    <span id="saveStatus">Loading…</span>
    <button class="io-btn" onclick="exportData()" title="Export all data as JSON file">
      <i class="ti ti-download"></i> Export
    </button>
    <button class="io-btn" onclick="document.getElementById('importInput').click()" title="Import data from JSON file">
      <i class="ti ti-upload"></i> Import
    </button>
    <input type="file" id="importInput" accept=".json" style="display:none" onchange="importData(this)">
    <button class="reset-link" onclick="resetToDefaults()">Reset to defaults</button>
  </div>

  <div class="datasets" id="datasetList"></div>

  <div class="axis-controls">
    <span class="axis-section-label">X axis (Abnormal index):</span>
    <label>Min <input type="number" id="xMin" placeholder="auto" step="0.1" onchange="saveAxis()"></label>
    <span class="axis-divider">–</span>
    <label>Max <input type="number" id="xMax" placeholder="auto" step="0.1" onchange="saveAxis()"></label>
    <button class="axis-auto-btn" onclick="resetAxis('x')">Auto</button>
    <span class="axis-divider" style="margin:0 6px">|</span>
    <span class="axis-section-label">Y axis (Probability density):</span>

  </div>
  <div id="emptyCard" class="msg-card" style="display:none">
    No data selected. Check at least one sub-dataset and press RUN.
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>

      { label:'BL',  checked:false, data:'' },

      { label:'BS',  checked:false, data:'' }
    ]
  }
};

const STORAGE_KEY = 'ndp_save';
const DEFAULT_META = {
  title: 'Normal distribution plotter',
  subtitle: 'Add datasets, select sub-datasets, then press RUN to plot.',
  notesOpen: true
};
let meta = { ...DEFAULT_META };

// ---------- Tabs: each tab is its own workspace (datasets, notes, axis range) ----------
let tabs = [];
let activeTabId = null;
let tabIdCounter = 0;
let dragTabId = null;
const histories = {};   // per-tab undo/redo, kept in memory only

// Working copy of the active tab
let datasets = [];
let idCounter = 0;
let chartInstance = null;
let saveTimer = null;

// Undo/redo stacks (of the active tab)
let undoStack = [];
let redoStack = [];
const MAX_HISTORY = 50;

function activeTab() { return tabs.find(t => t.id === activeTabId); }

function emptyAxis() { return { xMin: '', xMax: '', yMin: '', yMax: '' }; }

function makeTab(name, ds, opts = {}) {
  return {
    id: tabIdCounter++,
    name,
    datasets: ds,
    idCounter: opts.idCounter ?? ds.length,
    notes: opts.notes || [],
    axis: opts.axis || emptyAxis(),
    ran: false
  };
}

function syncToTab() {
  const t = activeTab();
  if (!t) return;
  t.datasets = datasets;
  t.idCounter = idCounter;
  histories[t.id] = { undo: undoStack, redo: redoStack };
}

function loadActiveTab() {
  const t = activeTab();
  datasets = t.datasets;
  idCounter = t.idCounter;
  const h = histories[t.id];
  undoStack = h ? h.undo : [];
  redoStack = h ? h.redo : [];
  const ax = t.axis || emptyAxis();
  ['xMin','xMax','yMin','yMax'].forEach(k => { document.getElementById(k).value = ax[k] ?? ''; });
}

function currentState() { return JSON.stringify({ datasets, idCounter }); }
function applyState(s) { const st = JSON.parse(s); datasets = st.datasets; idCounter = st.idCounter; }

// Call BEFORE changing data: remembers the state so it can be undone
function snapshot() {
  undoStack.push(currentState());
  if (undoStack.length > MAX_HISTORY) undoStack.shift();
  redoStack = [];
  updateUndoRedo();
}

function updateUndoRedo() {
  const u = document.getElementById('undoBtn');
  const r = document.getElementById('redoBtn');
  if (u) u.disabled = undoStack.length === 0;
  if (r) r.disabled = redoStack.length === 0;
}

function undo() {
  if (!undoStack.length) return;
  redoStack.push(currentState());
  applyState(undoStack.pop());
  render();
  scheduleSave();
  updateUndoRedo();
}

function redo() {
  if (!redoStack.length) return;
  undoStack.push(currentState());
  applyState(redoStack.pop());
  render();
  scheduleSave();
  updateUndoRedo();
}

function moveDs(id, dir) {
  const idx = datasets.findIndex(d => d.id === id);
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= datasets.length) return;
  snapshot();
  const tmp = datasets[idx];
  datasets[idx] = datasets[newIdx];
  datasets[newIdx] = tmp;
  render();
  scheduleSave();
}

function serialize() {
  syncToTab();
  return {
    version: 3,
    meta,
    tabs: tabs.map(({ id, name, datasets, idCounter, notes, axis, ran }) => ({ id, name, datasets, idCounter, notes, axis, ran })),
    activeTabId,
    tabIdCounter
  };
}

function saveToStorage() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(serialize()));
    setSaveStatus('Saved · ' + new Date().toLocaleTimeString());
  } catch(e) {}
}

function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveToStorage, 600);
}

function setSaveStatus(msg, color) {
  const dot = document.getElementById('saveDot');
  const status = document.getElementById('saveStatus');
  if (dot) dot.style.background = color || '#1D9E75';
  if (status) status.textContent = msg;
}

function loadFromStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY)
              || localStorage.getItem('ndp_datasets_v2')
              || localStorage.getItem('ndp_datasets_v1');
    if (!raw) return false;
    const parsed = JSON.parse(raw);
    if (parsed.tabs && parsed.tabs.length) {
      tabs = parsed.tabs.map(t => ({ notes: [], axis: emptyAxis(), ran: false, ...t }));
      tabIdCounter = parsed.tabIdCounter ?? (Math.max(...tabs.map(t => t.id)) + 1);
      activeTabId = tabs.some(t => t.id === parsed.activeTabId) ? parsed.activeTabId : tabs[0].id;
    } else if (parsed.datasets) {
      // Older single-page save → becomes the first tab
      tabs = [makeTab('Waveform data', parsed.datasets, { idCounter: parsed.idCounter, notes: parsed.meta?.notes })];
      activeTabId = tabs[0].id;
    } else {
      return false;
    }
    if (parsed.meta) {
      meta = {
        title: parsed.meta.title || DEFAULT_META.title,
        subtitle: parsed.meta.subtitle || DEFAULT_META.subtitle,
        notesOpen: parsed.meta.notesOpen ?? true
      };
    }
    loadActiveTab();
    return true;
  } catch(e) { console.error(e); }
  return false;
}

function presetDatasets() {
  return Object.entries(PRESET).map(([name, d], i) => ({
    id: i, name, checked: true, color: d.color, expanded: false,
    subs: d.subs.map((s, j) => ({ id: j, ...s }))
  }));
}

function blankDataset(id, name, color) {
  return {
    id, name, checked: true, color, expanded: true,
    subs: SUB_LABELS.map((l, i) => ({ id: i, label: l, checked: false, data: '' }))
  };
}

function resetToDefaults() {
  const t = activeTab();
  if (!confirm(`Reset the datasets in tab "${t.name}" back to the default data?\nOther tabs and notes are kept, and you can Undo this.`)) return;
  snapshot();
  datasets = presetDatasets();
  idCounter = datasets.length;
  render();
  saveToStorage();
  setSaveStatus('Tab reset to defaults');
  updateUndoRedo();
}

function exportData() {
  const json = JSON.stringify(serialize(), null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ndp_data_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
  setSaveStatus('Exported all tabs · ' + new Date().toLocaleTimeString());
}

// Imported tabs are ADDED next to your current tabs (nothing is overwritten)
function importData(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const parsed = JSON.parse(e.target.result);
      const base = file.name.replace(/\.json$/i, '');
      let added;
      if (parsed.tabs && parsed.tabs.length) {
        added = parsed.tabs.map(t => makeTab(t.name || base, t.datasets || [], { idCounter: t.idCounter, notes: t.notes, axis: t.axis }));
      } else if (parsed.datasets) {
        added = [makeTab(base, parsed.datasets, { idCounter: parsed.idCounter, notes: parsed.meta?.notes })];
      } else {
        throw new Error('Invalid file');
      }
      syncToTab();
      tabs.push(...added);
      activeTabId = added[0].id;
      loadActiveTab();
      renderAll();
      saveToStorage();
      setSaveStatus(`Imported ${added.length} tab${added.length > 1 ? 's' : ''} from ${file.name} · ` + new Date().toLocaleTimeString());
    } catch(err) {
      alert('Could not import: ' + err.message);
    }
  };
  reader.readAsText(file);
  input.value = '';
}

function init() {
  const restored = loadFromStorage();
  if (!restored) {
    tabs = [makeTab('Waveform data', presetDatasets())];
    activeTabId = tabs[0].id;
    loadActiveTab();
  }
  saveToStorage();
  setSaveStatus(restored ? 'Restored from last session · ' + new Date().toLocaleTimeString() : 'Default data loaded');
  renderAll();
}

function renderAll() {
  renderTabs();
  renderMeta();
  render();
  updateUndoRedo();
  const t = activeTab();
  document.getElementById('chartCard').style.display = 'none';
  document.getElementById('emptyCard').style.display = 'none';
  if (t.ran) { try { runChart(); } catch(e) { console.error(e); } }
}

// ---------- Tab bar ----------
function switchTab(id) {
  if (id === activeTabId) return;
  syncToTab();
  activeTabId = id;
  loadActiveTab();
  renderAll();
  scheduleSave();
}

function addTab(mode) {
  closeTabMenu();
  syncToTab();
  const cur = activeTab();
  let ds;
  if (mode === 'copy' && cur) {
    // Same dataset names, colours and sub-dataset labels — data left empty
    ds = cur.datasets.map((d, i) => ({
      id: i, name: d.name, checked: d.checked, color: d.color, expanded: i === 0,
      subs: d.subs.map((s, j) => ({ id: j, label: s.label, checked: s.checked, data: '' }))
    }));
  } else {
    ds = [blankDataset(0, 'C0', DEFAULT_COLORS[0])];
  }
  const t = makeTab('New tab', ds);
  const idx = tabs.findIndex(x => x.id === activeTabId);
  tabs.splice(idx + 1, 0, t);          // opens right next to the current tab, like Chrome
  activeTabId = t.id;
  loadActiveTab();
  renderAll();
  scheduleSave();
  startRenameTab(t.id);                // type the name straight away (e.g. "FFT")
}

function closeTab(id) {
  if (tabs.length <= 1) return;
  const t = tabs.find(x => x.id === id);
  const hasContent = t.datasets.some(d => d.subs.some(s => s.data)) || t.notes.some(n => n.text);
  if (hasContent && !confirm(`Close tab "${t.name}"?\nIts data and notes will be deleted. (Use Export first if you want a backup.)`)) return;
  syncToTab();
  const idx = tabs.findIndex(x => x.id === id);
  tabs.splice(idx, 1);
  delete histories[id];
  if (id === activeTabId) {
    activeTabId = tabs[Math.min(idx, tabs.length - 1)].id;
    loadActiveTab();
    renderAll();
  } else {
    renderTabs();
  }
  scheduleSave();
}

function startRenameTab(id) {
  const span = document.getElementById('tabName-' + id);
  if (!span) return;
  const t = tabs.find(x => x.id === id);
  const tabEl = span.closest('.tab');
  if (tabEl) tabEl.draggable = false;
  const input = document.createElement('input');
  input.className = 'tab-rename';
  input.value = t.name;
  span.replaceWith(input);
  input.focus();
  input.select();
  let done = false;
  const commit = save => {
    if (done) return;
    done = true;
    if (save) t.name = input.value.trim() || t.name;
    renderTabs();
    renderNotes();
    updateChartTitle();
    scheduleSave();
  };
  input.addEventListener('keydown', e => {
    e.stopPropagation();
    if (e.key === 'Enter') commit(true);
    if (e.key === 'Escape') commit(false);
  });
  input.addEventListener('blur', () => commit(true));
  input.addEventListener('click', e => e.stopPropagation());
  input.addEventListener('dblclick', e => e.stopPropagation());
}

function renderTabs() {
  const list = document.getElementById('tabList');
  list.innerHTML = tabs.map(t => `
    <div class="tab ${t.id === activeTabId ? 'active' : ''}" draggable="true" data-id="${t.id}"
         onclick="switchTab(${t.id})" ondblclick="startRenameTab(${t.id})"
         title="${escapeHtml(t.name)} — double-click to rename, drag to reorder">
      <i class="ti ti-chart-line tab-icon"></i>
      <span class="tab-name" id="tabName-${t.id}">${escapeHtml(t.name)}</span>
      ${tabs.length > 1 ? `<button class="tab-close" onclick="event.stopPropagation(); closeTab(${t.id})" title="Close tab">&times;</button>` : ''}
    </div>`).join('');

  list.querySelectorAll('.tab').forEach(el => {
    el.addEventListener('dragstart', e => {
      dragTabId = +el.dataset.id;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', el.dataset.id);
      el.classList.add('dragging');
    });
    el.addEventListener('dragend', () => {
      el.classList.remove('dragging');
      list.querySelectorAll('.drag-over').forEach(x => x.classList.remove('drag-over'));
      dragTabId = null;
    });
    el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('drag-over'); });
    el.addEventListener('dragleave', () => el.classList.remove('drag-over'));
    el.addEventListener('drop', e => {
      e.preventDefault();
      const targetId = +el.dataset.id;
      if (dragTabId === null || dragTabId === targetId) return;
      const from = tabs.findIndex(t => t.id === dragTabId);
      const [moved] = tabs.splice(from, 1);
      const to = tabs.findIndex(t => t.id === targetId);
      tabs.splice(from <= to ? to + 1 : to, 0, moved);
      dragTabId = null;
      renderTabs();
      scheduleSave();
    });
  });

  const active = list.querySelector('.tab.active');
  if (active) active.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

function toggleTabMenu(e) {
  e.stopPropagation();
  const menu = document.getElementById('tabMenu');
  menu.classList.toggle('open');
  menu.style.left = '0'; menu.style.right = 'auto';
  if (menu.classList.contains('open') && menu.getBoundingClientRect().right > window.innerWidth - 8) {
    menu.style.left = 'auto'; menu.style.right = '0';
  }
}
function closeTabMenu() { document.getElementById('tabMenu').classList.remove('open'); }
document.addEventListener('click', e => { if (!e.target.closest('.new-tab-wrap')) closeTabMenu(); });

function saveAxis() {
  const t = activeTab();
  t.axis = {};
  ['xMin','xMax','yMin','yMax'].forEach(k => { t.axis[k] = document.getElementById(k).value; });
  scheduleSave();
}

function updateChartTitle() {
  const el = document.getElementById('chartTitle');
  if (el) el.textContent = 'Normal distributions — ' + activeTab().name;
}

// ---------- Title, description & notes ----------
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function setMeta(key, value) {
  meta[key] = value.trim() || DEFAULT_META[key];
  renderMeta();
  scheduleSave();
}

function renderMeta() {
  document.getElementById('titleInput').value = meta.title;
  document.getElementById('subtitleInput').value = meta.subtitle;
  document.title = meta.title;
  renderNotes();
}

function toggleNotes() {
  meta.notesOpen = !meta.notesOpen;
  renderNotes();
  scheduleSave();
}

function renderNotes() {
  const t = activeTab();
  const notes = t.notes;
  document.getElementById('notesTabName').textContent = t.name;
  document.getElementById('notesBody').classList.toggle('open', !!meta.notesOpen);
  document.getElementById('notesChevron').className = 'ti ti-chevron-' + (meta.notesOpen ? 'up' : 'down');
  document.getElementById('notesCount').textContent = notes.length ? `${notes.length} note${notes.length > 1 ? 's' : ''}` : 'none yet';
  document.getElementById('notesList').innerHTML = notes.map(n => `
    <div class="note-item">
      <div class="note-top">
        <input class="note-topic" value="${escapeHtml(n.topic)}" placeholder="Topic…"
               onchange="updateNote(${n.id}, 'topic', this.value)">
        <span class="note-date">${escapeHtml(n.updated)}</span>
        <button class="sub-del-btn" onclick="deleteNote(${n.id})" title="Delete note"><i class="ti ti-x"></i></button>
      </div>
      <textarea class="note-text" placeholder="Write what you want to remember next time…"
                onchange="updateNote(${n.id}, 'text', this.value)">${escapeHtml(n.text)}</textarea>
    </div>
  `).join('');
}

function stamp() {
  const d = new Date();
  return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function addNote() {
  activeTab().notes.push({ id: Date.now(), topic: 'New topic', text: '', updated: stamp() });
  meta.notesOpen = true;
  renderNotes();
  scheduleSave();
  const inputs = document.querySelectorAll('.note-topic');
  const last = inputs[inputs.length - 1];
  if (last) { last.focus(); last.select(); }
}

function updateNote(id, key, value) {
  const n = activeTab().notes.find(n => n.id === id);
  if (!n) return;
  n[key] = value;
  n.updated = stamp();
  renderNotes();
  scheduleSave();
}

function deleteNote(id) {
  if (!confirm('Delete this note?')) return;
  const t = activeTab();
  t.notes = t.notes.filter(n => n.id !== id);
  renderNotes();
  scheduleSave();
}

function render() {
  const list = document.getElementById('datasetList');
  list.innerHTML = '';
  datasets.forEach(ds => {
    const checkedCount = ds.subs.filter(s => s.checked).length;
    const div = document.createElement('div');
    div.className = 'ds-row';
    const idx = datasets.indexOf(ds);
    const isFirst = idx === 0;
    const isLast = idx === datasets.length - 1;
    div.innerHTML = `
      <div class="ds-header">
        <input type="checkbox" ${ds.checked ? 'checked' : ''} onchange="toggleDs(${ds.id}, this.checked)">
        <input class="ds-name-input" value="${ds.name}" onchange="renameDs(${ds.id}, this.value)">
        <div class="color-wrap">
          <div class="color-swatch" style="background:${ds.color}"></div>
          <input type="color" value="${ds.color}" onchange="setColor(${ds.id}, this.value)">
        </div>
        <div class="reorder-btns">
          <button class="reorder-btn" onclick="moveDs(${ds.id}, -1)" ${isFirst ? 'disabled' : ''} title="Move up">▲</button>
          <button class="reorder-btn" onclick="moveDs(${ds.id}, 1)" ${isLast ? 'disabled' : ''} title="Move down">▼</button>
        </div>
        <button class="expand-btn" onclick="toggleExpand(${ds.id})">
          <i class="ti ti-${ds.expanded ? 'chevron-up' : 'chevron-down'}"></i>
          data (${checkedCount}/${ds.subs.length})
        </button>
        <button class="del-btn" onclick="deleteDs(${ds.id})">
          <i class="ti ti-trash"></i> delete
        </button>
      </div>
      <div class="sub-datasets ${ds.expanded ? 'open' : ''}" id="subs-${ds.id}">
        ${ds.subs.map(sub => `
          <div class="sub-row">
            <input type="checkbox" class="sub-check" ${sub.checked ? 'checked' : ''} onchange="toggleSub(${ds.id}, ${sub.id}, this.checked)">
            <div class="sub-info">
              <input class="sub-label-input" value="${sub.label}" onchange="renameSubLabel(${ds.id}, ${sub.id}, this.value)" title="Click to rename">
              <div class="sub-preview">${sub.data ? sub.data.split(',').slice(0,6).join(', ') + '...' : 'No data yet'}</div>
              <textarea class="sub-textarea" placeholder="Paste comma-separated values here…" onchange="updateSubData(${ds.id}, ${sub.id}, this.value)">${sub.data}</textarea>
            </div>
            <button class="sub-del-btn" onclick="deleteSub(${ds.id}, ${sub.id})" title="Remove sub-dataset">
              <i class="ti ti-x"></i>
            </button>
          </div>
        `).join('')}
        <button class="add-sub-btn" onclick="addSub(${ds.id})">
          <i class="ti ti-plus"></i> Add sub-dataset
        </button>
      </div>
    `;
    list.appendChild(div);
  });
}

function toggleDs(id, v) { snapshot(); find(id).checked = v; scheduleSave(); updateUndoRedo(); }
function renameDs(id, v) { snapshot(); find(id).name = v; scheduleSave(); updateUndoRedo(); }
function setColor(id, v) { snapshot(); find(id).color = v; render(); scheduleSave(); updateUndoRedo(); }
function toggleExpand(id) { const d = find(id); d.expanded = !d.expanded; render(); scheduleSave(); }
function deleteDs(id) { snapshot(); datasets = datasets.filter(d => d.id !== id); render(); scheduleSave(); updateUndoRedo(); }
function toggleSub(dsId, subId, v) { snapshot(); findSub(dsId, subId).checked = v; scheduleSave(); updateUndoRedo(); }
function updateSubData(dsId, subId, v) { snapshot(); findSub(dsId, subId).data = v.trim(); render(); scheduleSave(); updateUndoRedo(); }
function deleteSub(dsId, subId) { snapshot(); const d = find(dsId); d.subs = d.subs.filter(s => s.id !== subId); render(); scheduleSave(); updateUndoRedo(); }

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
  if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.key === 'z' && e.shiftKey))) { e.preventDefault(); redo(); }
});

function addSub(dsId) {
  snapshot();
  const d = find(dsId);
  const idx = d.subs.length;
  d.subs.push({ id: Date.now(), label: SUB_LABELS[idx] || `Sub${idx+1}`, checked: true, data: '' });
  d.expanded = true;
  render();
  scheduleSave();
  updateUndoRedo();
}

function addDataset() {
  snapshot();
  const idx = datasets.length;
  datasets.push({
    id: idCounter++, name: 'C_new', checked: true,
    color: DEFAULT_COLORS[idx % DEFAULT_COLORS.length],
    expanded: true,
    subs: SUB_LABELS.map((l, i) => ({ id: i, label: l, checked: false, data: '' }))
  });
  render();
  scheduleSave();
  updateUndoRedo();
}

function find(id) { return datasets.find(d => d.id === id); }
function findSub(dsId, subId) { return find(dsId).subs.find(s => s.id === subId); }

function parseData(str) {
  return str.split(',').map(s => parseFloat(s.trim())).filter(v => !isNaN(v));
}

function normalPDF(x, mean, std) {
  return (1 / (std * Math.sqrt(2 * Math.PI))) * Math.exp(-0.5 * ((x - mean) / std) ** 2);
}

function renameSubLabel(dsId, subId, v) { snapshot(); findSub(dsId, subId).label = v.trim() || 'Sub'; scheduleSave(); updateUndoRedo(); }

function getAxisVal(id) {
  const el = document.getElementById(id);
  if (!el || el.value.trim() === '') return null;
  const v = parseFloat(el.value);
  return isNaN(v) ? null : v;
}

function resetAxis(axis) {
  if (axis === 'x') {
    document.getElementById('xMin').value = '';
    document.getElementById('xMax').value = '';
  } else {
    document.getElementById('yMin').value = '';
    document.getElementById('yMax').value = '';
  }
  saveAxis();
}

function runChart() {
  activeTab().ran = true;
  updateChartTitle();
  scheduleSave();
  const series = [];
  datasets.forEach(ds => {
    if (!ds.checked) return;
    const checkedSubs = ds.subs.filter(sub => sub.checked);
    if (checkedSubs.length === 0) return;
    const allVals = [];
    checkedSubs.forEach(sub => {
      parseData(sub.data).forEach(v => allVals.push(v));
    });
    if (allVals.length < 2) return;
    const mean = allVals.reduce((a, b) => a + b, 0) / allVals.length;
    const std = Math.sqrt(allVals.reduce((a, b) => a + (b - mean) ** 2, 0) / allVals.length);
    if (std === 0) return;
    const subNames = checkedSubs.map(s => s.label).join('+');
    series.push({ label: `${ds.name} (${subNames})`, color: ds.color, mean, std, n: allVals.length });
  });

  const chartCard = document.getElementById('chartCard');
  const emptyCard = document.getElementById('emptyCard');

  if (series.length === 0) {
    chartCard.style.display = 'none';
    emptyCard.style.display = 'block';
    return;
  }
  emptyCard.style.display = 'none';
  chartCard.style.display = 'block';
  window._lastSeries = series;

  const xMin = Math.min(...series.map(s => s.mean - 3.5 * s.std));
  const xMax = Math.max(...series.map(s => s.mean + 3.5 * s.std));
  const pts = 400;
  const step = (xMax - xMin) / (pts - 1);
  const xVals = Array.from({ length: pts }, (_, i) => xMin + i * step);

  const chartDatasets = series.map(s => ({
    label: s.label,
    data: xVals.map(x => ({ x, y: normalPDF(x, s.mean, s.std) })),
    borderColor: s.color,
    backgroundColor: 'transparent',
    borderWidth: 2.5,
    pointRadius: 0,
    tension: 0.4
  }));

  if (chartInstance) { chartInstance.destroy(); }
  const ctx = document.getElementById('mainChart').getContext('2d');
  chartInstance = new Chart(ctx, {
    type: 'line',
    data: { datasets: chartDatasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: i => `${i.dataset.label}: ${i.parsed.y.toFixed(4)}`
          }
        }
      },
      scales: {
        x: {
          type: 'linear',
          title: { display: true, text: 'Abnormal index', font: { size: 13 } },
          ticks: { maxTicksLimit: 10, callback: v => parseFloat(v).toFixed(3) },
          ...(getAxisVal('xMin') !== null ? { min: getAxisVal('xMin') } : {}),
          ...(getAxisVal('xMax') !== null ? { max: getAxisVal('xMax') } : {})
        },
        y: {
          title: { display: true, text: 'Probability density', font: { size: 13 } },
          ticks: { callback: v => parseFloat(v).toFixed(3) },
          ...(getAxisVal('yMin') !== null ? { min: getAxisVal('yMin') } : {}),
          ...(getAxisVal('yMax') !== null ? { max: getAxisVal('yMax') } : {})
        }
      }
    }
  });

  const leg = document.getElementById('legend');
  leg.innerHTML = series.map(s => `
    <div class="leg-item">
      <div class="leg-swatch" style="background:${s.color}"></div>
      <span>${s.label}: μ = ${s.mean.toFixed(4)}, σ = ${s.std.toFixed(4)}</span>
    </div>
  `).join('');

  // Stats table
  const statsWrap = document.getElementById('statsWrap');
  statsWrap.innerHTML = `
    <table class="stats-table">
      <thead>
        <tr>
          <th>Dataset</th>
          <th>Mean (μ)</th>
          <th>Std Dev (σ)</th>
          <th>N values</th>
        </tr>
      </thead>
      <tbody>
        ${series.map(s => `
          <tr>
            <td><span class="color-dot" style="background:${s.color}"></span>${s.label}</td>
            <td>${s.mean.toFixed(6)}</td>
            <td>${s.std.toFixed(6)}</td>
            <td>${s.n}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

function exportPicture() {
  const name = prompt('Enter a file name for the export:', 'normal_distribution_' + activeTab().name.replace(/[^\w\-]+/g, '_') + '_' + new Date().toISOString().slice(0,10));
  if (name === null) return; // cancelled
  const filename = (name.trim() || 'normal_distribution') + '.png';

  // Draw chart + stats onto an offscreen canvas
  const chartCanvas = document.getElementById('mainChart');
  const series = window._lastSeries || [];

  // Build rows text for stats
  const statsLines = series.map(s =>
    `${s.label}    μ = ${s.mean.toFixed(6)}    σ = ${s.std.toFixed(6)}    N = ${s.n}`
  );
  const rowH = 28;
  const padding = 20;
  const statsHeight = statsLines.length * rowH + padding * 2 + 36;

  const exportCanvas = document.createElement('canvas');
  exportCanvas.width = chartCanvas.width;
  exportCanvas.height = chartCanvas.height + statsHeight;
  const ctx2 = exportCanvas.getContext('2d');

  // White background
  ctx2.fillStyle = '#ffffff';
  ctx2.fillRect(0, 0, exportCanvas.width, exportCanvas.height);

  // Draw chart
  ctx2.drawImage(chartCanvas, 0, 0);

  // Draw stats table header
  const tableY = chartCanvas.height + padding;
  ctx2.fillStyle = '#f7f7f5';
  ctx2.fillRect(0, chartCanvas.height, exportCanvas.width, statsHeight);
  ctx2.fillStyle = '#1a1a18';
  ctx2.font = 'bold 14px sans-serif';
  ctx2.fillText('Statistics', padding, tableY + 16);

  // Column headers
  ctx2.font = '12px sans-serif';
  ctx2.fillStyle = '#6b6b66';
  ctx2.fillText('Dataset', padding, tableY + 38);
  ctx2.fillText('Mean (μ)', 280, tableY + 38);
  ctx2.fillText('Std Dev (σ)', 430, tableY + 38);
  ctx2.fillText('N', 590, tableY + 38);

  // Divider
  ctx2.strokeStyle = '#e0e0e0';
  ctx2.beginPath();
  ctx2.moveTo(padding, tableY + 44);
  ctx2.lineTo(exportCanvas.width - padding, tableY + 44);
  ctx2.stroke();

  // Rows
  series.forEach((s, i) => {
    const y = tableY + 44 + (i + 1) * rowH;
    // color dot
    ctx2.fillStyle = s.color;
    ctx2.beginPath();
    ctx2.arc(padding + 6, y - 4, 5, 0, Math.PI * 2);
    ctx2.fill();
    ctx2.fillStyle = '#1a1a18';
    ctx2.font = '12px sans-serif';
    ctx2.fillText(s.label, padding + 16, y);
    ctx2.fillText(s.mean.toFixed(6), 280, y);
    ctx2.fillText(s.std.toFixed(6), 430, y);
    ctx2.fillText(s.n, 590, y);
    // row divider
    ctx2.strokeStyle = '#f0f0f0';
    ctx2.beginPath();
    ctx2.moveTo(padding, y + 8);
    ctx2.lineTo(exportCanvas.width - padding, y + 8);
    ctx2.stroke();
  });

  // Download
  const a = document.createElement('a');
  a.href = exportCanvas.toDataURL('image/png');
  a.download = filename;
  a.click();
}

init();
</script>
